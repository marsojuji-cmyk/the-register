name: controls
on:
  push:
  pull_request:
jobs:
  controls:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: python3 -m pip install --quiet pyyaml
      # One command, identical to the pre-push hook. Anything else is two different
      # standards wearing one name — and until this was wired, `git push --no-verify`
      # bypassed the local gate while CI reported green (WS-5 in WEAK-SPOTS.md).
      - name: Enforce the full contract (same command as .githooks/pre-push)
        run: python3 tools/tests/verify_all.py

