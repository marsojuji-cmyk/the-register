name: Claims integrity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify markdown claims
        run: python3 scripts/check_claims.py
